id: claude-md-stays-under-budget
kind: static
why: >
  CLAUDE.md loads into every session. Left ungoverned it accretes until the
  signal is buried. The budget is 150 lines for the whole file — there is no
  longer a generated section to exclude, so every line counts against it.
  Raised from 120 in 1.5.0 to hold the Simplicity First rules, which are worth
  their weight because they fire on every piece of code written. That is the bar
  for raising it again: a rule that pays for itself on every session, not one
  more thing that would be nice to state. Otherwise, exceeding it means
  something must be cut.
shell: |
  python3 -c "
import pathlib,sys
n=len(pathlib.Path('CLAUDE.md').read_text().splitlines())
print(f'CLAUDE.md budget: {n}/150')
sys.exit(0 if n<150 else 1)
"
