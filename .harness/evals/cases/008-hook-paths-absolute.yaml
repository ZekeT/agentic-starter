id: hook-commands-use-absolute-paths
kind: static
why: >
  Found the hard way. Hook commands using a bare relative path resolve against
  the session's cwd, not the project root. The moment cwd moves into any
  subdirectory, EVERY hook fails with "can't open file" — the env guard, the
  secrets scanner, the dangerous-bash blocker, all of them, silently and at
  once. The guardrails are gone exactly when nobody is looking. Claude Code
  exports $CLAUDE_PROJECT_DIR for this; use it. The statusLine entry is the
  same shape and slipped through once already, so it's checked here too.
shell: |
  python3 -c "
import json, pathlib, re, sys
cfg = json.loads(pathlib.Path('.claude/settings.json').read_text())
bad = []
for events in cfg.get('hooks', {}).values():
    for matcher in events:
        for h in matcher.get('hooks', []):
            cmd = h.get('command', '')
            if '.claude/hooks/' in cmd and 'CLAUDE_PROJECT_DIR' not in cmd:
                bad.append(cmd)
status_cmd = cfg.get('statusLine', {}).get('command', '')
if '.claude/' in status_cmd and 'CLAUDE_PROJECT_DIR' not in status_cmd:
    bad.append(status_cmd)
if bad:
    print('commands with cwd-relative paths:')
    for c in bad: print('  ', c)
    print('use: python3 \"\$CLAUDE_PROJECT_DIR\"/.claude/hooks/<name>.py')
    sys.exit(1)
"
