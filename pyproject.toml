[project]
name = "your-project-name"
version = "0.1.0"
description = ""
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# The harness depends on these, not just your local workflow. Trimming any of
# black, isort, autoflake, mypy, or pytest breaks something concrete:
#   black, isort, autoflake → post_tool_lint.py hook shells out to them
#   mypy, pytest            → `make check`, the gate every agent must pass
# Add whatever else your project needs; remove those five only if you also
# rewire the hook and the Makefile.
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "autoflake>=2.3.0",
    "interrogate>=1.7.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

# Template state: the project itself is not yet a buildable package.
# Once you create `src/<your_package>/__init__.py`, set `package = true`
# (or remove this section) and add a [build-system] block, e.g.:
#
#   [build-system]
#   requires = ["hatchling"]
#   build-backend = "hatchling.build"
#
#   [tool.hatch.build.targets.wheel]
#   packages = ["src/<your_package>"]
[tool.uv]
package = false

# --- Formatter ---
[tool.black]
line-length = 88
target-version = ["py311"]

# --- Import sorter (black-compatible) ---
[tool.isort]
profile = "black"
line_length = 88

# --- Type checker ---
[tool.mypy]
python_version = "3.11"
strict = true
# strict enables: disallow_any_generics, disallow_untyped_defs,
# warn_return_any, warn_unused_ignores, and more.
# Override selectively below if strict is too aggressive for third-party libs.
ignore_missing_imports = true
# Per-module overrides (add as needed):
# [[tool.mypy.overrides]]
# module = "some_untyped_library.*"
# ignore_missing_imports = true

# --- Unused import cleaner ---
# Run via: autoflake --remove-all-unused-imports --in-place --recursive src/
# (configured in Makefile, not natively supported in pyproject.toml)

# --- Docstring coverage ---
[tool.interrogate]
ignore-init-method = true
ignore-init-module = true
ignore-magic = true
ignore-semiprivate = false
ignore-private = false
fail-under = 80
verbose = 1
quiet = false
color = true

# --- Test runner ---
# --cov-fail-under is intentionally omitted: with no src/ yet (template state),
# coverage always collects 0% and the gate fails before any project code exists.
# Add `--cov-fail-under=80` back to addopts once src/<your_package>/ exists.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
