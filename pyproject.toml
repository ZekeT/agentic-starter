[project]
name = "your-project-name"
version = "0.1.0"
description = ""
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
# The harness depends on these, not just your local workflow:
#   ruff          → post_tool_lint.py hook shells out to it; `make fmt`/`make lint`
#   mypy, pytest  → `make check`, the gate every agent must pass
# ruff replaced black + isort + autoflake + interrogate in one binary. Add
# whatever else your project needs; remove these three only if you also rewire
# the hook and the Makefile.
dev = [
    "ruff>=0.14.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

# Template state: the project itself is not yet a buildable package.
# Once you create `src/<your_package>/__init__.py`, set `package = true`
# (or remove this section) and add a [build-system] block, e.g.:
#
#   [build-system]
#   requires = ["hatchling"]
#   build-backend = "hatchling.build"
#
#   [tool.hatch.build.targets.wheel]
#   packages = ["src/<your_package>"]
[tool.uv]
package = false

# --- Formatter + linter (one tool: format, imports, unused code, docstrings) ---
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9 + F is ruff's default. E501 is deliberately absent: the formatter
# owns line length, and E501 only ever fires on strings and comments it cannot
# split, where the wrap is a judgement call.
#   I  → import order (was isort)
#   F401/F841 → unused imports and variables (was autoflake), auto-fixed
#   D  → docstring presence and shape (was interrogate)
#   B  → bugbear: mutable defaults, silent except, loop-variable capture
#   UP → syntax that is obsolete on the project's target-version
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B", "D"]
# The docstring exemptions the old interrogate config carried, kept verbatim:
# package __init__.py, dunder methods, and __init__ itself.
ignore = ["D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# A test's name is its docstring. Requiring both produces restatement, not
# documentation.
"**/tests/**" = ["D"]
# migrate_to_framework.py is run standalone against *other* projects, often with
# whatever `python3` is on PATH rather than this project's 3.12 venv. Its
# sys.version_info fallbacks are load-bearing there, not dead code.
".harness/scripts/migrate_to_framework.py" = ["UP036"]

# --- Type checker ---
[tool.mypy]
python_version = "3.12"
strict = true
# strict enables: disallow_any_generics, disallow_untyped_defs,
# warn_return_any, warn_unused_ignores, and more.
# Override selectively below if strict is too aggressive for third-party libs.
ignore_missing_imports = true
# Per-module overrides (add as needed):
# [[tool.mypy.overrides]]
# module = "some_untyped_library.*"
# ignore_missing_imports = true

# --- Test runner ---
# --cov-fail-under is intentionally omitted: with no src/ yet (template state),
# coverage always collects 0% and the gate fails before any project code exists.
# Add `--cov-fail-under=80` back to addopts once src/<your_package>/ exists.
# See .harness/docs/testing.md for why coverage is a signal, not a gate.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --strict-markers"
# Categories are selected by marker, never by path, so `-m "not integration"`
# works the same whether or not a project has an integration suite yet.
# --strict-markers turns a typo'd marker into an error rather than a silent
# selection of nothing.
markers = [
    "integration: crosses a real boundary — filesystem, network, DB, subprocess",
    "e2e: exercises the whole system through its public entrypoint",
    "slow: deliberately expensive; excluded from the fast feedback loop",
]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]
