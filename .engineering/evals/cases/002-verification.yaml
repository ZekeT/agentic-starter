id: independent-readonly-verification-and-human-shipping
kind: static
why: Fresh verification and human authorization must survive workflow replacement.
shell: |
  python3 - <<'PY'
  from pathlib import Path
  for name in ('maintainability-reviewer', 'verifier', 'security-reviewer'):
      text = Path(f'.claude/agents/{name}.md').read_text()
      assert 'readonly: true' in text
  verifier = Path('.claude/agents/verifier.md').read_text()
  assert 'make check' in verifier and 'Never silently fix' in verifier
  assert 'implementation-session reasoning' in verifier
  ship = Path('.claude/commands/ship.md').read_text()
  assert 'Completed' in ship and 'acceptance review is required' in ship
  assert 'Honor narrower requests' in ship and 'Never merge or force-push' in ship
  assert 'do not rerun unchanged authoritative checks' in ship
  assert 'engineering publish preflight' in ship and 'actual PR/MR URL' in ship
  PY
