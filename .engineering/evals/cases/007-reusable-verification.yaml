id: reusable-verification-without-self-certification
kind: static
why: Local commits and reusable evidence must not imply acceptance or publication.
shell: |
  python3 - <<'PY'
  from pathlib import Path
  policy = Path('CLAUDE.md').read_text()
  assert 'authorizes local commits within the requested scope' in policy
  assert 'never self-certify' in policy
  review = Path('.claude/commands/review.md').read_text()
  for phrase in ('Reuse current complete evidence', 'missing/stale', 'INCOMPLETE', 'Do not edit application content'):
      assert phrase in review, phrase
  guide = Path('.engineering/docs/verification.md').read_text()
  for phrase in ('does not authenticate', 'never relabel', 'Human acceptance remains separate', 'Unrelated'):
      assert phrase.lower() in guide.lower(), phrase
  assert 'isolated `checkout` path' in Path('.claude/agents/verifier.md').read_text()
  assert 'Preparation failures leave proof INCOMPLETE' in review
  assert 'Committed changes outside `paths` fail preparation' in guide
  # Verification classification uses a recorded installation role, never a default.
  assert 'installation role' in guide and 'No role is ever' in guide
  # Requirements follow role and ownership, never which Make targets exist.
  assert 'never which Make targets exist' in guide and 'never PASS' in guide
  assert 'update/upstream route' in Path('ENGINEERING.md').read_text()
  assert 'role and path ownership' in policy and 'role and path ownership' in review
  assert 'role and path ownership' in Path('.claude/agents/verifier.md').read_text()
  assert 'records the `consumer` installation' in Path('ENGINEERING.md').read_text()
  assert '/.engineering/state/verification/' in Path('.gitignore').read_text()
  PY
