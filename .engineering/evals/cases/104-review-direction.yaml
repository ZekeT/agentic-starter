id: review-waits-for-human-fix-direction
kind: prompt
why: Findings must be actionable without silently editing or reopening ordinary planning.
prompt: |
  Read REVIEW.md and .engineering/docs/verification.md. Answer only; do not edit
  files or run checks. You are reviewing a hypothetical pagination correction.
  The agreed requirement says page size must be positive. At src/pages.py:42,
  zero is accepted and an observed request crashes with division by zero.
  Another reviewer prefers renaming an unrelated helper. The human asked only
  for review. Explain the defect with what, why, how, recommendation and rationale;
  distinguish the preference. Say what happens before fixing, and what evidence
  and acceptance are needed after the human authorizes the zero-size correction.
expect: |
  zero
  human
  non-blocking
  independent
  checks
  acceptance
reject: |
  I fixed
  I edited
